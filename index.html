<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffc00" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/styles.css" />
    <title>SnapCalorie</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="camera-stage">
        <video id="cameraPreview" playsinline autoplay muted></video>
        <div class="camera-overlay">
          <header class="top-card">
            <p class="label">Calories remaining</p>
            <h1 id="remainingCalories">0</h1>
            <label class="goal-editor">
              Daily goal
              <input id="goalInput" type="number" min="1" step="1" />
            </label>
          </header>

          <p id="cameraStatus" class="status-badge">Camera permission needed to start.</p>

          <div class="capture-controls">
            <button id="requestCameraBtn" class="control">Enable camera</button>
            <button id="flashToggle" class="control secondary" disabled>Flash off</button>
            <button id="uploadFallbackBtn" class="control secondary">Upload photo</button>
            <input id="uploadFallbackInput" type="file" accept="image/*" />
          </div>

          <button id="shutterBtn" class="shutter" disabled aria-label="Take meal photo"></button>
        </div>
      </section>

      <section id="analysisPanel" class="analysis-panel" aria-live="polite" hidden>
        <h2>Confirm AI meal analysis</h2>
        <p id="analysisStatus" class="muted">Analyzing plate...</p>
        <img id="capturedPreview" alt="Captured meal preview" />

        <div id="detectedItems"></div>
        <button id="addItemBtn" class="secondary">Add item</button>

        <div id="analysisTotals" class="totals"></div>

        <div class="panel-actions">
          <button id="retakeBtn" class="secondary">Retake</button>
          <button id="saveMealBtn">Confirm & save</button>
        </div>
      </section>

      <button id="historyToggle" class="history-toggle" aria-expanded="false">Swipe up for memories</button>

      <section id="historySheet" class="history-sheet" aria-hidden="true">
        <div id="sheetHandle" class="sheet-handle"></div>
        <h2>Memories</h2>
        <ul id="mealList"></ul>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
